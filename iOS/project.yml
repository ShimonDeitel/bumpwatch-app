name: Bumpwatch
options:
  bundleIdPrefix: com.shimondeitel.bumpwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Bumpwatch:
    type: application
    platform: iOS
    sources:
      - path: Bumpwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.bumpwatch
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Bumpwatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  BumpwatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BumpwatchTests
    dependencies:
      - target: Bumpwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.bumpwatch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  BumpwatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BumpwatchUITests
    dependencies:
      - target: Bumpwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.bumpwatch.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Bumpwatch:
    build:
      targets:
        Bumpwatch: all
        BumpwatchTests: [test]
        BumpwatchUITests: [test]
    test:
      targets:
        - BumpwatchTests
        - BumpwatchUITests
